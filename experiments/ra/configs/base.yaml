# Full key space of an RA run config. Every other config is a delta on this
# file; validation rejects any key that does not appear here (except inside the
# free-form `solver_kwargs` blocks).
name: unnamed
mode: dispatch              # dispatch | plan  (D-W1)
dataset:
  dir: ca2040_z4            # relative to data_root()
  years: [2020]
  window: {start: 0, stop: 8760}
system:
  voll: 10000.0
  demand_scaling: peak_fraction   # none | fixed | peak_fraction
  peak_capacity_fraction: 0.85
  scale_load: 1.0
  clip_scale_to_one: true
  link_losses: true
  export_mode: sink
  carbon_tax: 0.0
  storage_init_soc: 0.5
  storage_final_soc: 0.5
  # Storage boundary condition of every block (and of the reference solve).
  #   fixed       -- energy[0] = storage_init_soc * E, energy[T] = storage_final_soc * E
  #   cyclic_free -- energy[0] = energy[T], level chosen by the optimizer
  #                  (storage_init_soc / storage_final_soc are then ignored)
  storage_soc_mode: cyclic_free   # fixed | cyclic_free (default cyclic_free, decision 2026-09-09)
  # Unit scaling handed to the importer (wy_store LoadOptions). 1.0 keeps the
  # system in MW / $, which is what every reported metric is denominated in;
  # a different scaling only changes the conditioning of the ADMM solve, and
  # block_metrics converts the reported numbers back to MW / $.
  power_unit: 1.0
  cost_unit: 1.0
heuristics:
  name: none                # none | ucap_derate | elcc_prm  (a label; see D-W4)
  ucap_derate: false
  outage_draws: []          # list of draw indices; [] means weather only
selection:
  # --- `mode: dispatch` reads these ---
  blocks: [24, 168]         # block sizes to solve, hours
  reference: window         # window | full_year | none
  reference_window: {start: 5040, hours: 672}   # 28 days from hour 5040 = 30*168 = 210*24
  # --- `mode: plan` reads these (R-W9: each mode ignores the other's half) ---
  strategy: all             # all | uniform | random | stratified | kmedoids | gradient_stress
  block_size: 168           # null = the whole loaded horizon (the monolithic sentinel)
  num_blocks: null
  avoid_year_boundaries: false
  seed: 42
planning:                   # `mode: plan` only (WP5 spec 8.1)
  method: monolithic        # monolithic | stochastic | relaxed | gradient | admm
  dispatch_solver: CLARABEL
  dispatch_solver_kwargs: {verbose: false}
  regularize: 1.0e-6
  num_workers: 1
  timeout_s: 21600
  required: true            # a planning failure fails the run
  bounds:                   # capacity floors; a modelling choice, see spec 9.5
    min_capacity_mw: 0.1
    min_storage_mw: 10.0
  expansion:
    mode: pypsa             # none | pypsa
    max_capacity_multiple: 10.0
    max_capacity_mw: null
  single_level:
    kind: primal            # primal | strong_duality
    solver: HIGHS
    solver_kwargs: {}
    inf_value: 100.0
    price_bound: 100.0
  warm_start:
    enabled: false
    num_blocks: null
    solver: HIGHS
    solver_kwargs: {}
  optimizer:
    num_iterations: 100
    # GradientDescent clips the TOTAL gradient norm to `clip` and then moves
    # `step_size * clip`, so `step_size * clip` caps the L2 capacity movement of
    # one iteration, in MW. The measured gradient norm is ~1.3e4 on the 48 h test
    # fixture and ~1.8e7 on z4-2020, always above `clip`, so the cap binds and one
    # iteration moves exactly step_size * clip: 0.2 * 5e3 = 1,000 MW per
    # step, ~0.5 % of z4-2020's ~209 GW fleet. The old (1e-3, 1e+3) pair allowed
    # 1 MW per iteration and made the gradient method a no-op.
    step_size: 0.2
    clip: 5.0e+3
    batch_size: 0           # 0 -> all subproblems
    batch_strategy: sequential   # sequential | fixed | random
    init_full_loss: true
    save_param_history: true
    eval_final_full_loss: false  # DEPRECATED and ignored; setting it true is a ConfigError
    peak_net_load_k: null
    peak_net_load_rerank_every: 1
  admm:
    machine: cpu            # cpu | cuda | mps
    dtype: float32
    adapt_rho: false
    adapt_rho_rate: 0.1
    # Carry each block's ADMM state between planner forward passes.  Distinct
    # from `planning.warm_start`, which is the single-level LP warm start.
    warm_start: true
    warm_start_reset_every: null   # null | positive int; cold-start every Nth pass
    # minimum_iterations >= 100 guards against spurious convergence right after a
    # warm restart (warm-start spec §3.4).
    # rho is $/(MWh*MW), i.e. the MW->$ conversion: 1.0 was right for runner.py's
    # power_unit=1000 / cost_unit=10 and is ~80x too large at power_unit=cost_unit=1
    # (natural value ||price||/||power|| ~ 0.012; 0.1 converges fastest on z4).
    solver_kwargs: {num_iterations: 1000, rho_power: 0.1, minimum_iterations: 100}
  emissions:
    mode: none              # none | price | cap | dual_ascent  (D-W5)
    price: 0.0
    cap: null
    cap_basis: annual       # annual | horizon
    dual_ascent:
      target: null
      initial_weight: 0.0
      dual_step_size: 1.0
      max_weight: 1000.0
      num_outer_iterations: 10
      tolerance: 0.05
  budget_constraints: null  # path to a CSV (absolute, or relative to the config root)
methods:
  lp:
    enabled: true
    solver: HIGHS           # any cvxpy solver name, or STUB for a dry pipeline
    solver_kwargs: {}
    timeout_s: 3600
    required: true          # a failure here fails the run
  admm:
    enabled: false
    required: false         # a failure here never fails the run
    solver: ADMM            # ADMM, or STUB for a dry pipeline
    # rho is $/(MWh*MW), i.e. the MW->$ conversion: 1.0 was right for runner.py's
    # power_unit=1000 / cost_unit=10 and is ~80x too large at power_unit=cost_unit=1
    # (natural value ||price||/||power|| ~ 0.012; 0.1 converges fastest on z4).
    solver_kwargs: {num_iterations: 5000, rho_power: 0.1, atol: 1.0e-4, rtol: 1.0e-4}
    dtype: float64
    timeout_s: 3600
    # Gates on the iterate. Above either one the task is recorded `infeasible` and
    # left out of the run card's headline. Each gate resolves as: the absolute key
    # if it is set, else the relative key times the block's own scale -- so a 24 h
    # and a 168 h block are held to the same *standard* rather than the same number.
    #
    # NOT FINALISED (Kamran, 2026-09-09). The absolute keys are deliberately still
    # set, so this file's behaviour is unchanged and the relative gate is opt-in:
    # set `max_imbalance_mw: null` in a config delta to switch it on. Two things
    # are open before the relative form becomes the default: (a) the threshold
    # itself -- 2.5e-5 is back-derived from the interim 2 MW gate at ca2040_z4's
    # ~81.9 GW peak load, not measured, and must be set from the measured
    # distribution of `admm_imbalance_rel` on converged blocks and recorded in
    # `memory/numbers.yaml`; (b) the denominator -- block peak load (a system
    # quantity) vs per-bus throughput (which would gate the worst bus against its
    # own scale). `dispatch.resolve_gate` takes the scale as an argument, so (b) is
    # a change of what `solve_block_admm` passes in, not of the mechanism.
    max_imbalance_mw: 1.0         # absolute gate, MW; null => use max_imbalance_rel
    max_imbalance_rel: 2.5e-5     # x block peak load (inert while the absolute is set)
    max_soc_residual_mwh: 1.0     # absolute gate, MWh; null => use max_soc_residual_rel
    max_soc_residual_rel: 2.5e-5  # x block storage energy capacity (likewise inert)
execution:
  shard: null               # "k/n"; null = all tasks
  max_tasks: null
  force: false
output:
  # Persistence flags. `output` is excluded from the run-id hash (identity.
  # EXCLUDED_FROM_HASH): what a run writes never changes what it computes.  The
  # *effective* block is recorded in env.json instead.  See
  # memory/plans/2026-09-09-plots-spec.md section 2.
  runs_root: null           # null -> paths.runs_root()
  save_hourly: none         # none | carrier_bus  (D2; 'device' is rejected)
  hourly_quantities: all    # "all", or a list drawn from persist.HOURLY_QUANTITIES
  combine_hourly: true      # aggregate concatenates hourly/*.parquet -> hourly.parquet
  save_ens_profile: true    # per-hour ENS, only for the hours with a shortfall
  # Prices at EVERY bus in `hourly`, not only load buses (D5). Off by default:
  # on ca2040_z4 the extra buses are the import bus and the export buses, whose
  # duals are degenerate (a flat 56-61 $/MWh) and are not system prices, so they
  # must never be pooled into a price statistic -- but they are worth recording
  # when diagnosing ADMM duals, which is what `price_error.parquet` does. When
  # this is on, every price row carries `carrier = load_bus | other_bus`.
  price_all_buses: false
  # Write `price_error.parquet`: the per-(bus, hour) decomposition of every ADMM
  # block's dual error against the reference LP, plus its three summary columns
  # on metrics.csv. Costs nothing unless the run has both ADMM blocks and a
  # reference solve with persisted prices.
  save_price_error: true
  admm_trace_every: 0       # 0 = off; k > 0 keeps every k-th ADMM iteration
  save_iterations: true     # planning: the three iteration tables
  figures: false            # write the debug figures at aggregate time
