# ADMM dual-error decomposition over ONE MONTH, not the year.
#
# Purpose: locate the ~3 $/MWh load-bus price error that a 168 h ADMM block
# plateaus at (measured 2026-09-09 at rho 0.1; see
# `experiments/runs/price_error_rho01_2026-09-09/REPORT.md` in the brain repo).
# Every ADMM block's duals are compared against the reference LP per (bus, hour)
# and written to `price_error.parquet`, which plots O12 / O13 read.
#
# Window [5047, 5719) = 672 h = 4 x 168 h = 28 x 24 h, starting at hour 5047 so
# blocks begin at Pacific midnight (window start 7 + 210*24), the same window
# family the price re-measurement used. The reference is the whole window solved
# as one LP, so every block shares (bus, hour) with it.
includes: [../base.yaml, ../datasets/ca2040_z4.yaml, ../methods/admm_cpu.yaml]
name: op_benchmark_z4_2020_admm_month
dataset: {years: [2020], window: {start: 5047, stop: 5719}}
# export_mode: drop -- the export stores have e_nom=0 as built, so an as-built
# operations run must not export.
system:  {voll: 10000.0, demand_scaling: peak_fraction, peak_capacity_fraction: 0.85, export_mode: drop}
selection:
  blocks: [24, 168]
  reference: window
  reference_window: {start: 5047, hours: 672}
methods:
  lp:   {enabled: true, solver: HIGHS, timeout_s: 3600}
  # Gates stay at admm_cpu.yaml's interim absolutes (2 MW / 2 MWh); the relative
  # form is recorded on every row as `admm_imbalance_rel` / `admm_soc_residual_rel`.
  admm: {enabled: true, required: false, timeout_s: 3600}
output:
  save_hourly: carrier_bus
  # Every bus, so `price_error.parquet` can report the all-bus max next to the
  # load-bus max. On z4 the extra buses are the import and export buses, whose
  # duals are degenerate (a flat 56-61 $/MWh) -- recorded, never pooled.
  price_all_buses: true
  save_price_error: true
  admm_trace_every: 25
