# tolerance-sensitivity vs c4b/c5b, 2026-09-09.
#
# Identical to `plan_z4_2020_c4b_adam.yaml` in EVERY key except the three stopping
# tolerances below. The question it answers: c4' and c5' both ended on a
# tolerance rather than on wall clock or the iteration backstop, so the design
# they returned is a function of where those tolerances were set. Tightening
# them by 10x (relative objective decrease) and 4x (stationarity) says how much
# objective is left on the table at the shipped settings -- and, if the answer
# is "almost none", that the tolerances are not the thing determining the
# result.
#
# `num_iterations: 500` and `max_seconds: 3600` are unchanged, so a tighter
# tolerance can only move the stop LATER, never earlier: if this cell ends on
# `max_seconds` or `num_iterations` where c4'/c5' ended on a tolerance, that is
# itself the answer.
includes:
  - ../base.yaml
  - ../datasets/ca2040_z4.yaml
  - ../networks/z4_full.yaml
  - ../methods/plan_gradient.yaml
  - ../selection/all_weeks.yaml
  - ../heuristics/none.yaml
  - ../emissions/none.yaml
name: plan_z4_2020_c4c_adam_tight
dataset: {years: [2020], window: {start: 7, stop: 8743}}
system: {demand_scaling: none, export_mode: drop}
planning:
  dispatch_solver: HIGHS
  dispatch_solver_kwargs: {verbose: false}
  num_workers: 12
  timeout_s: 7200
  warm_start: {enabled: true, num_blocks: 12, solver: HIGHS}
  optimizer:
    rule: adam
    # MW per coordinate per iteration. The largest gap between c4's design and
    # cell 2's LP is 3.7 GW, which 200 MW/iteration closes in ~19 iterations.
    step_size: 200.0
    adam:
      beta1: 0.9          # averages ~10 gradients -- the window c5's SNR needs
      beta2: 0.999
      eps: 1.0            # $/MW-yr, the units of the gradient (NOT 1e-8)
      max_step_mw: 600.0  # 3 * step_size, stated rather than defaulted
    lr_decay: cosine
    lr_decay_final_frac: 0.05
    num_iterations: 500
    batch_size: 0              # 0 -> every subproblem, every iteration
    batch_strategy: sequential
    max_seconds: 3600
    design_selection: best_checkpointed
    checkpoint_every: 20
    save_param_history: true
    stopping:
      # Full batch, so the per-iteration loss IS the full-horizon objective and
      # the plateau test runs on it, over a 20-ITERATION window. The window must
      # fill before the test can fire: c4's measured per-iteration relative
      # decrease is 4.7e-5 and its 20-iteration one ~9.4e-4, so a window that
      # shrank to fit would end this run after one step.
      # TIGHTENED vs c4b: 1e-4 -> 1e-5 on the objective plateau and
      # 0.02 -> 0.005 on stationarity. `tol_window` stays 20 iterations, so the
      # window over which the plateau is measured is the same; only the
      # threshold moves.
      tol_rel_objective: 1.0e-5
      tol_window: 20
      checkpoint_window: 5        # unused here (full batch); stated for symmetry
      tol_stationarity: 0.005
    grad_history_every: 10
output: {save_iterations: true}
