# ARCHIVED: pre-Adam campaign, 2026-09-09. The harness default step rule became
# `rule: adam` on 2026-09-10 (Kamran's decision; memory/plans/2026-09-10-step-rule-spec.md),
# so the `planning.optimizer` block below pins the rule and its settings as this
# cell ACTUALLY RAN. Do not modernise this file -- the Adam reruns of cells 4 and
# 5 are plan_z4_2020_c4b_adam.yaml / plan_z4_2020_c5b_adam.yaml.
#
# Phase-2 campaign, cell 4: DETERMINISTIC gradient descent. The pool is all 52
# weeks and the batch is all of them every iteration, so the sampled objective
# IS the full objective and `design_selection: best_sampled` selects the true
# best iterate at no extra cost.
#
# Dispatch solver: HIGHS simplex, default options. Decided from
# experiments/runs/solver_duals_2026-09-09/REPORT.md -- load-bus duals are
# solver-invariant, HiGHS gradients match one-sided finite differences on the
# zero-capacity candidate rows (which carry 79-93 % of the gradient norm) while
# CLARABEL's are 9,353-14,256 $/MW too large on every one of them, and HiGHS IPM
# is slower with the same duals.
#
# Budget: `optimizer.max_seconds` is the SOFT cap (finish the iteration, keep the
# design and the history); `timeout_s` is the hard backstop and must be larger.
# How many of the 200 iterations fit in the hour is a result, not a setting.
includes:
  - ../base.yaml
  - ../datasets/ca2040_z4.yaml
  - ../networks/z4_full.yaml
  - ../methods/plan_gradient.yaml
  - ../selection/all_weeks.yaml
  - ../heuristics/none.yaml
  - ../emissions/none.yaml
name: plan_z4_2020_c4_grad_det
dataset: {years: [2020], window: {start: 7, stop: 8743}}
system: {demand_scaling: none, export_mode: drop}
planning:
  dispatch_solver: HIGHS
  dispatch_solver_kwargs: {verbose: false}
  num_workers: 12
  timeout_s: 7200
  # 12 of the 52 blocks, `strategy: uniform` (hardcoded in GradientMethod.warm_start),
  # so cells 4 and 5 provably start from the SAME point. Not cell 3's LP, and not
  # a lower bound on the gradient loss: `blocks_match` is False, so
  # `lower_bound_raw` / `optimality_gap` stay empty by design.
  warm_start: {enabled: true, num_blocks: 12, solver: HIGHS}
  optimizer:
    # `rule: gradient` and everything under it is pinned for the archive: these
    # were the harness defaults on 2026-09-09 and are no longer.
    #   step_size * clip = 0.2 * 5e3 = 1,000 MW asked for per iteration -- of
    #   which 13.4 MW was actually realised, because the norm is taken over all
    #   166 rows and 127 of them cannot move (spec section 1).
    rule: gradient
    step_size: 0.2
    clip: 5.0e+3
    lr_decay: none
    num_iterations: 200
    batch_size: 0              # 0 -> every subproblem, every iteration
    batch_strategy: sequential
    max_seconds: 3600
    design_selection: best_sampled
    checkpoint_every: 0        # the sampled loss already is the full objective
    save_param_history: true
    # No convergence tests existed when this ran: `num_iterations` and
    # `max_seconds` were the only stops.
    stopping: {tol_rel_objective: null, tol_stationarity: null}
    grad_history_every: 0
output: {save_iterations: true}
