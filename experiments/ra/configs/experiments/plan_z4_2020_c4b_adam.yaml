# Phase-2 campaign, cell 4' (c4b): DETERMINISTIC gradient descent with the ADAM
# step rule (memory/plans/2026-09-10-step-rule-spec.md).
#
# Identical to `plan_z4_2020_c4_grad_det.yaml` in dataset, window, fleet,
# demand, export mode, VOLL, carbon tax, heuristics, block set, solver, seed and
# 12-week LP warm start -- and the 10x invented expansion bounds stay ON. ONLY
# `planning.optimizer` differs, so c4 vs c4' isolates the step rule.
#
# Why the rule changed. `rule: gradient` normalises the step by the 2-norm over
# ALL 166 parameter rows, of which 127 are structurally frozen (lower == upper)
# and carry 98.7 % of that norm: c4 reported a 1,000 MW step and moved the
# design by 13.4 MW, falling to 7.4 MW by iteration 199. Adam is per coordinate
# and its learning rate is in MW, so no global norm appears anywhere and one
# iteration moves at most `step_size` MW per row from any starting point.
#
# `num_iterations: 500` is a backstop, not a target: `max_seconds: 3600` or a
# tolerance is expected to bind first. It was 800 in the first pass; that run
# stopped on a tolerance at iteration 29, so 500 changes nothing about the
# result and is still ~17x the observed need. `stop_reason` on the run card says
# which of the three fired. NOTE that `num_iterations` is also the cosine decay
# horizon, so this number is not purely a backstop: at 500 the learning rate is
# still ~99.7 % of 200 MW at iteration 29.
#
# `checkpoint_every: 20` + `design_selection: best_checkpointed` is the same
# selection rule as cell 5', so the deterministic-vs-stochastic comparison is
# not confounded by the design-selection rule either. It also puts a
# full-horizon objective at iteration 200 in the history, which is where the
# original c4 row stopped -- that is the number to compare against it.
#
# Every `planning.optimizer` key below is written out even though most of them
# now EQUAL the base.yaml defaults (Adam became the harness default on
# 2026-09-10, with exactly these settings). They stay explicit because this is a
# campaign cell: reading the file must tell you what the run did without
# resolving the include chain, and a later change to the defaults must not
# silently change what c4' / c5' meant. The keys that are genuinely cell-specific
# are `num_iterations`, `batch_size`, `batch_strategy`, `num_workers` and
# `grad_history_every`.
includes:
  - ../base.yaml
  - ../datasets/ca2040_z4.yaml
  - ../networks/z4_full.yaml
  - ../methods/plan_gradient.yaml
  - ../selection/all_weeks.yaml
  - ../heuristics/none.yaml
  - ../emissions/none.yaml
name: plan_z4_2020_c4b_adam
dataset: {years: [2020], window: {start: 7, stop: 8743}}
system: {demand_scaling: none, export_mode: drop}
planning:
  dispatch_solver: HIGHS
  dispatch_solver_kwargs: {verbose: false}
  num_workers: 12
  timeout_s: 7200
  warm_start: {enabled: true, num_blocks: 12, solver: HIGHS}
  optimizer:
    rule: adam
    # MW per coordinate per iteration. The largest gap between c4's design and
    # cell 2's LP is 3.7 GW, which 200 MW/iteration closes in ~19 iterations.
    step_size: 200.0
    adam:
      beta1: 0.9          # averages ~10 gradients -- the window c5's SNR needs
      beta2: 0.999
      eps: 1.0            # $/MW-yr, the units of the gradient (NOT 1e-8)
      max_step_mw: 600.0  # 3 * step_size, stated rather than defaulted
    lr_decay: cosine
    lr_decay_final_frac: 0.05
    num_iterations: 500
    batch_size: 0              # 0 -> every subproblem, every iteration
    batch_strategy: sequential
    max_seconds: 3600
    design_selection: best_checkpointed
    checkpoint_every: 20
    save_param_history: true
    stopping:
      # Full batch, so the per-iteration loss IS the full-horizon objective and
      # the plateau test runs on it, over a 20-ITERATION window. The window must
      # fill before the test can fire: c4's measured per-iteration relative
      # decrease is 4.7e-5 and its 20-iteration one ~9.4e-4, so a window that
      # shrank to fit would end this run after one step.
      tol_rel_objective: 1.0e-4
      tol_window: 20
      checkpoint_window: 5        # unused here (full batch); stated for symmetry
      tol_stationarity: 0.02
    grad_history_every: 10
output: {save_iterations: true}
