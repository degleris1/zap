# ARCHIVED: pre-Adam campaign, 2026-09-09. The harness default step rule became
# `rule: adam` on 2026-09-10 (Kamran's decision; memory/plans/2026-09-10-step-rule-spec.md),
# so the `planning.optimizer` block below pins the rule and its settings as this
# cell ACTUALLY RAN. Do not modernise this file -- the Adam reruns of cells 4 and
# 5 are plan_z4_2020_c4b_adam.yaml / plan_z4_2020_c5b_adam.yaml.
#
# Phase-2 campaign, cell 1: single-level LP over the whole 8736 h window
# (coverage 1, phi = 1). The reference design; every other cell is a temporal or
# algorithmic approximation of this one. HiGHS on the laptop (decision
# 2026-09-09); `planning.timeout_s` is the only fallback -- if this does not
# finish in 4 h the cell is deferred to Sherlock/Gurobi.
includes:
  - ../base.yaml
  - ../datasets/ca2040_z4.yaml
  - ../networks/z4_full.yaml
  - ../methods/plan_monolithic.yaml
  - ../selection/full_horizon.yaml
  - ../heuristics/none.yaml
  - ../emissions/none.yaml
name: plan_z4_2020_c1_lp_full
dataset: {years: [2020], window: {start: 7, stop: 8743}}   # 8736 h = 52*168 = 364*24, from local (Pacific) midnight
# Unscaled demand: peak load / peak available is 1.17 on the 2040 retired fleet,
# so the planner must build. `demand_scaling: none` applies factor 1.0 and
# ignores peak_capacity_fraction.
system: {demand_scaling: none, export_mode: drop}
planning:
  timeout_s: 14400
  single_level: {solver: HIGHS, solver_kwargs: {}}
  # Pinned for the archive only: a single-level LP never enters the descent
  # loop, so none of this was read. It records what the config surface said when
  # this cell ran, so re-reading the file cannot mislead.
  optimizer:
    rule: gradient
    step_size: 0.2
    clip: 5.0e+3
    lr_decay: none
    design_selection: best_sampled
    checkpoint_every: 0
    stopping: {tol_rel_objective: null, tol_stationarity: null}
    grad_history_every: 0
output: {save_iterations: true}
