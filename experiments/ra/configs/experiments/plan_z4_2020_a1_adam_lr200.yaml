# Step-rule ablation A1 (memory/plans/2026-09-10-step-rule-spec.md section 4):
# Adam at the campaign learning rate, cell 4's system, 200 iterations.
#
# The four ablations A1-A4 are cell 4 (deterministic, all 52 weeks, 12-week LP
# warm start) with ONLY `planning.optimizer` changed, run for the same 200
# iterations as the original c4 row so they compare at equal iterations and at
# equal wall clock. A1 is the reference: if it lands within ~20 % of A3's
# objective, Adam costs the deterministic cell nothing relative to the best
# rule available to it.
#
# No `stopping` tolerances and no cosine decay here: an ablation compares rules
# at a fixed iteration count, so nothing may stop early and the learning rate
# must be the one under test for all 200 iterations.
includes:
  - ../base.yaml
  - ../datasets/ca2040_z4.yaml
  - ../networks/z4_full.yaml
  - ../methods/plan_gradient.yaml
  - ../selection/all_weeks.yaml
  - ../heuristics/none.yaml
  - ../emissions/none.yaml
name: plan_z4_2020_a1_adam_lr200
dataset: {years: [2020], window: {start: 7, stop: 8743}}
system: {demand_scaling: none, export_mode: drop}
planning:
  dispatch_solver: HIGHS
  dispatch_solver_kwargs: {verbose: false}
  num_workers: 12
  timeout_s: 7200
  warm_start: {enabled: true, num_blocks: 12, solver: HIGHS}
  optimizer:
    rule: adam
    step_size: 200.0
    adam: {beta1: 0.9, beta2: 0.999, eps: 1.0, max_step_mw: 600.0}
    lr_decay: none
    num_iterations: 200
    batch_size: 0
    batch_strategy: sequential
    max_seconds: 3600
    design_selection: best_checkpointed
    checkpoint_every: 20
    save_param_history: true
    grad_history_every: 10
output: {save_iterations: true}
