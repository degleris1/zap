# Gradient-descent decomposition over 52 weekly blocks, warm-started from a
# single-level LP on 12 of them. Sherlock only. The step rule is base.yaml's
# default (Adam: 200 MW per coordinate per iteration, cosine-decayed, per-row
# cap 600 MW) and the run stops on the objective-plateau or stationarity
# tolerance rather than on `num_iterations`.
#
# The warm start runs on 12 of the 52 blocks, so its optimum is pro-rated to a
# different coverage than the gradient loss and is NOT a lower bound on it: the
# card reports it as `warm_start_objective_raw` and leaves `lower_bound_raw` /
# `optimality_gap` empty. Set warm_start.num_blocks: null to get a real bound.
includes:
  - ../base.yaml
  - ../datasets/ca2040_z4.yaml
  - ../networks/z4_full.yaml
  - ../methods/plan_gradient.yaml
  - ../selection/all_weeks.yaml
  - ../heuristics/none.yaml
  - ../emissions/none.yaml
name: plan_z4_2020_gradient_weeks
dataset: {years: [2020], window: {start: 7, stop: 8743}}
system: {export_mode: drop}
planning:
  dispatch_solver: CLARABEL
  num_workers: 8
  warm_start: {enabled: true, num_blocks: 12, solver: GUROBI}
