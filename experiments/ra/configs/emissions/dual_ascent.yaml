# Subgradient ascent on the emissions price until the target is met. Valid only
# for the gradient and admm methods (D-W5); the target is annualized like a cap.
# The penalty method is NOT guaranteed to hit the target under stochastic
# operations -- that is the thing the chapter has to validate (PROJECT.md 2.2).
planning:
  emissions:
    mode: dual_ascent
    cap_basis: annual
    dual_ascent:
      target: 20.0e+6
      initial_weight: 0.0
      dual_step_size: 1.0e-5
      max_weight: 1000.0
      num_outer_iterations: 10
      tolerance: 0.05
