# Strong-duality (McCormick) relaxation of the bilevel problem.
#
# NOT RUNNABLE, and rejected at config time: RelaxedPlanningProblem dualizes the
# device list through `zap.dual.dualize`, whose DUAL_CLASS table has no entry for
# WP3's `DirectedLine` (it knows DCLine / ACLine only), so every system this
# harness builds raises `KeyError: DirectedLine`. `experiments/ra/config.py`
# therefore rejects `planning.single_level.kind: strong_duality` the same way it
# rejects `heuristics.name: elcc_prm` -- as unimplemented, not as a typo. The
# file is kept so the axis, and what it will mean, stay on the record; writing a
# dual `DirectedLine` is phase-2 zap work.
#
# `planning.emissions.mode: cap` is a ConfigError here too: RelaxedPlanningProblem
# has no emissions_limit parameter (D-W5).
mode: plan
selection: {strategy: all, block_size: null}
planning:
  method: relaxed
  single_level: {kind: strong_duality, solver: HIGHS, price_bound: 100.0}
