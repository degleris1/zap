# ADMM dispatch on the CPU. Never gates a run (required: false); see spec R7.
#
# Settings follow the phase-1 benchmark review, sections 3.6 and 7.5, and are only
# meaningful with the corrected battery prox (3.1) and the unit-consistent
# convergence test (3.2). `adaptive_rho` stays off: the rule is only safe now
# that rho_min / rho_max clamp it, and a fixed rho keeps blocks comparable.
#
# rho has units of $/(MWh*MW) -- it is the MW-to-dollar conversion in the
# augmented Lagrangian -- so it is tied to the importer's unit scaling by
# rho_scaled = rho_physical * power_unit / cost_unit. At this harness's
# power_unit = cost_unit = 1 the natural value is ||price||/||power|| ~ 1.2e-2;
# rho = 0.1 measured fastest on ca2040_z4 (review 7.4/7.6: every 24 h block
# converges legitimately in ~1,600-1,900 iterations, within +/-0.002 % of the LP),
# which is why the iteration cap drops from 20,000 to 5,000.
# `battery_inner_iterations: 200` is load-bearing: at 10-25 the outer loop
# declares convergence while the storage SoC recursion is off by 20-26 MWh and the
# objective is 1.6-2.7 % high. Do not lower it.
methods:
  lp:
    enabled: true
    solver: HIGHS
    required: true
  admm:
    enabled: true
    required: false
    solver: ADMM
    dtype: float64
    timeout_s: 3600
    # Interim absolute gates, and still the effective default (Kamran, 2026-09-09):
    # a converged 168 h solve sits at ~1.0-1.1 on both quantities while a 24 h solve
    # sits far below, so the old 1.0 thresholds rejected legitimately converged
    # weekly blocks. That is a block-length correction, which the relative gate
    # (`max_imbalance_rel` / `max_soc_residual_rel` in base.yaml) does properly --
    # but neither its threshold nor its denominator is settled, so nothing switches
    # yet. To measure the relative form, set both keys below to `null`; every block
    # already records `admm_imbalance_rel` and `admm_soc_residual_rel` either way.
    max_imbalance_mw: 2.0
    max_soc_residual_mwh: 2.0   # storage SoC-recursion residual gate (projected prox iterate)
    solver_kwargs:
      num_iterations: 5000
      minimum_iterations: 100
      rho_power: 0.1
      adaptive_rho: false
      rtol_dual_use_objective: false
      atol: 1.0e-6
      rtol: 1.0e-5
      battery_inner_iterations: 200
      battery_inner_over_relaxation: 1.8
